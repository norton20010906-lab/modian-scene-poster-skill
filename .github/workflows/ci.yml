name: validate-skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - run: python scripts/audit_repository.py --root . --allowed-model "D5 Ultra"
      - run: python scripts/preflight.py --workspace . --catalog data/products.yaml --templates data/layout_templates.yaml --model "D5 Ultra" --host-capability vision --host-capability image-generation
